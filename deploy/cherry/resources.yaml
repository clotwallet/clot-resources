apiVersion: v1
kind: Namespace
metadata:
  name: resources
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clot-resources
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: clot-resources
  template:
    metadata:
      labels:
        app: clot-resources
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
          command: [nginx, '-g', 'daemon off;']
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /wallet/privacy.md
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: policy
              mountPath: /srv/wallet
              readOnly: true
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policy
          configMap:
            name: wallet-policy
        - name: config
          configMap:
            name: resources-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clot-resources
spec:
  selector:
    app: clot-resources
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clot-resources
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [resources.clotwallet.com]
      secretName: clot-resources-tls
  rules:
    - host: resources.clotwallet.com
      http:
        paths:
          - path: /wallet/privacy.md
            pathType: Exact
            backend:
              service:
                name: clot-resources
                port:
                  number: 8080
